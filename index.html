<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAF-PP · Sistema de Análise Financeira de Projetos Produtivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <div class="masthead">
    <div>
      <h1>Análise Financeira do Empreendimento Rural</h1>
      <div class="sub">Caderno de Campo Digital — adaptado do SAF-PP (Meloni, 2017).</div>
    </div>
    <div class="masthead-right">
      <div class="save-state"><span class="save-dot" id="saveDot"></span><span id="saveLabel">dados salvos neste dispositivo</span></div>
      <div class="top-actions">
        <button class="btn small" id="btnSample">Carregar exemplo</button>
        <button class="btn small danger" id="btnReset">Limpar tudo</button>
        <button class="btn small" id="btnExportJson">⭳ Exportar dados (.json)</button>
        <button class="btn small" id="btnImportJson">⭱ Importar dados</button>
        <input type="file" id="fileImportJson" accept="application/json,.json" style="display:none;">
        <button class="btn small ochre" id="btnExportPdf">⭳ Exportar PDF</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <nav class="tabs" id="tabs"></nav>
    <main class="content" id="content"></main>
  </div>

  <footer class="appfoot">SAF-PP · adaptado para empreendimentos já em andamento — investimentos existentes não geram novo desembolso, apenas patrimônio, depreciação e reposição futura.</footer>
</div>
<script src="app.js"></script>
</body>
</html>
